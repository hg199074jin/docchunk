[project]
name = "docchunk"
version = "1.0.1"
description = "Lossless, token-aware long-document preprocessing for LLM reading workflows"
requires-python = ">=3.12,<3.13"
dependencies = [
    "pydantic>=2.13.5",
    "rich>=15.0.0",
    "semantic-text-splitter>=0.32.0",
    "tiktoken>=0.14.0",
    "typer>=0.27.2",
]

[project.scripts]
docchunk = "docchunk.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.5",
]

[tool.hatch.build.targets.wheel]
packages = ["src/docchunk"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
  "external: requires installed external tools such as pandoc or mineru",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["docchunk"]

[[tool.mypy.overrides]]
module = ["semantic_text_splitter"]
ignore_missing_imports = true
